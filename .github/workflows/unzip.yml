name: Extract project zip
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['so-tien-hui-public.zip']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip to repo root
        run: |
          if [ ! -f so-tien-hui-public.zip ]; then echo "No zip file, nothing to do"; exit 0; fi
          mkdir -p extracted
          unzip -o so-tien-hui-public.zip -d extracted
          ls -la extracted
          shopt -s dotglob
          if [ "$(find extracted -mindepth 1 -maxdepth 1 | wc -l)" = "1" ] && [ -d "$(find extracted -mindepth 1 -maxdepth 1)" ]; then
            mv "$(find extracted -mindepth 1 -maxdepth 1)"/* ./
          else
            mv extracted/* ./
          fi
          rm -rf extracted so-tien-hui-public.zip
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git status --short
          git commit -m "Extract project files from zip" || echo "Nothing to commit"
          git push
